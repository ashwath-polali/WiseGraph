name: Keep Supabase awake

# Supabase's free tier pauses a project after ~7 days of inactivity. This runs a
# tiny query once a day so the database never goes idle long enough to pause,
# which means no more weekly "restore project" step.
#
# NOTE: GitHub only runs scheduled workflows from the repository's DEFAULT branch
# (main), so this file must be on main for the daily schedule to fire. You can
# also trigger it by hand from the Actions tab (Run workflow) to test it.

on:
  schedule:
    # 07:23 UTC daily — an odd minute off the hour, since GitHub delays crons
    # most at the top of the hour. Daily is a 7x margin under the 7-day window.
    - cron: "23 7 * * *"
  workflow_dispatch: {}

# don't stack runs if one is slow
concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # only the postgres driver is needed, so install just that (fast)
      - name: Install pg
        run: npm install pg@8 --no-audit --no-fund

      - name: Ping the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node wisemetrics/scripts/keep-alive.mjs
